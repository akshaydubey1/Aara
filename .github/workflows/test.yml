name: test

on: [push, pull_request]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check sw.js
        run: node --check sw.js
      - name: Run app tests (DOM-shimmed)
        run: node test/run.mjs
