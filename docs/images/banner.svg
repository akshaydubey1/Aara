  <text x="76" y="252" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#bcd3c1">Stock in CFT · Estimates &amp; GST · Profit · Labour · Auctions · WhatsApp</text>
  <text x="76" y="290" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#bcd3c1">Works offline · 13 Indian languages · Phone, tablet and computer</text>
