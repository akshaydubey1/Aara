<meta name="apple-mobile-web-app-capable" content="yes">

<title>Aara Sawmill Manager</title>
<meta name="theme-color" content="#24563A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Hind:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: app shell — left rail on desktop, bottom tab bar on phones; content column max 1120px. */
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --sunk:#E7EBE3; --ink:#1B231D; --muted:#58665B; --line:#D6DCD2;
  --forest:#24563A; --forest-ink:#FFFFFF; --chalk:#E2AC22; --chalk-ink:#2A1E00;
  --ok:#2E7D4F; --ok-bg:#E3F2E8; --warn:#9A5B00; --warn-bg:#FBEFD9; --bad:#B3261E; --bad-bg:#FBE4E2; --info:#2B5C8A; --info-bg:#E2ECF6;
  --display:"Rajdhani","Hind",system-ui,sans-serif; --body:"Hind",system-ui,-apple-system,"Segoe UI","Noto Sans",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,40,25,.06),0 4px 14px rgba(20,40,25,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111612; --surface:#192019; --sunk:#141A15; --ink:#E6ECE5; --muted:#9BA99E; --line:#2B352D;
  --forest:#79C493; --forest-ink:#0B1A10; --chalk:#F0C24A; --chalk-ink:#2A1E00;
  --ok:#7FD39E; --ok-bg:#16301F; --warn:#F2B865; --warn-bg:#33270F; --bad:#FF8F86; --bad-bg:#3A1714; --info:#8DBBE8; --info-bg:#132637;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111612; --surface:#192019; --sunk:#141A15; --ink:#E6ECE5; --muted:#9BA99E; --line:#2B352D;
  --forest:#79C493; --forest-ink:#0B1A10; --chalk:#F0C24A; --chalk-ink:#2A1E00;
  --ok:#7FD39E; --ok-bg:#16301F; --warn:#F2B865; --warn-bg:#33270F; --bad:#FF8F86; --bad-bg:#3A1714; --info:#8DBBE8; --info-bg:#132637;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;font-weight:700} h2{font-size:22px;font-weight:700} h3{font-size:17px;font-weight:600}
p{margin:0}
a{color:var(--forest)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* end-grain mark: growth rings of a log */
.rings{width:44px;height:44px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 46% 54%,var(--chalk) 0 9%,transparent 10%),
  repeating-radial-gradient(circle at 46% 54%,var(--forest) 0 2px,transparent 2px 5px),var(--surface);
  box-shadow:inset 0 0 0 3px var(--forest)}
.rings.big{width:120px;height:120px;box-shadow:inset 0 0 0 6px var(--forest)}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--forest)}
.btn.primary{background:var(--forest);color:var(--forest-ink);border-color:var(--forest)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.chalk{background:var(--chalk);color:var(--chalk-ink);border-color:var(--chalk);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--forest)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.icon{width:36px;min-height:36px;padding:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px}
input:focus,select:focus,textarea:focus{border-color:var(--forest);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--forest) 20%,transparent)}
input[type=checkbox]{width:18px;min-height:18px;accent-color:var(--forest)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:720px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;flex:none}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flat{box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)}
.p-info{background:var(--info-bg);color:var(--info)} .p-neutral{background:var(--sunk);color:var(--muted)}
/* painted lot mark, the way forest depots number logs */
.lot{display:inline-block;background:var(--chalk);color:var(--chalk-ink);font-family:var(--mono);font-weight:600;font-size:12px;padding:1px 7px;border-radius:3px;transform:rotate(-1.5deg)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;font-weight:500;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r);background:var(--info-bg);color:var(--info);font-size:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}

/* auth */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth-brand{background:var(--forest);color:var(--forest-ink);padding-block:48px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:32px;display:flex;flex-direction:column;gap:28px;justify-content:center}
.auth-brand .rings{box-shadow:inset 0 0 0 6px var(--forest-ink);background:radial-gradient(circle at 46% 54%,var(--chalk) 0 9%,transparent 10%),repeating-radial-gradient(circle at 46% 54%,var(--forest-ink) 0 2px,transparent 2px 6px),var(--forest)}
.auth-brand h1{font-size:44px}
.auth-brand ul{margin:0;padding:0;list-style:none;display:grid;gap:12px;max-width:440px}
.auth-brand li{display:flex;gap:10px;opacity:.95}
.auth-brand li b{font-family:var(--display);font-size:17px}
.auth-form{padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:center}
.auth-card{width:100%;max-width:440px}
@media (max-width:820px){.auth{grid-template-columns:minmax(0,1fr)}.auth-brand{padding:28px max(16px,env(safe-area-inset-left,0px)) 28px max(16px,env(safe-area-inset-right,0px));gap:14px}.auth-brand h1{font-size:34px}.auth-brand ul{display:none}.auth-form{padding:20px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.rail .brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.rail .brand b{font-family:var(--display);font-size:22px;line-height:1}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:0;background:transparent;cursor:pointer;text-align:left;color:var(--muted);font-weight:500;width:100%}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current=page]{background:color-mix(in srgb,var(--forest) 14%,transparent);color:var(--forest);font-weight:600}
.main{padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.main>.inner{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.bottom{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main{padding-bottom:96px}
  .bottom{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .bottom .nav{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;text-align:center;justify-content:center}
  .bottom .nav span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1}
.kpi .s{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:960px){.two{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it>div{min-width:0}
.person{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-family:var(--display);font-weight:700;color:var(--forest)}
.wood{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:baseline}

/* estimate */
.line{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) repeat(4,minmax(0,.7fr)) minmax(0,.9fr) minmax(0,.9fr) 36px;gap:8px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line)}
.line .out{min-height:40px;display:flex;flex-direction:column;justify-content:center}
@media (max-width:980px){.line{grid-template-columns:repeat(4,minmax(0,1fr))}.line .wide{grid-column:span 2}}
@media (max-width:440px){.line{grid-template-columns:repeat(2,minmax(0,1fr))}}
.totals{display:grid;gap:6px}
.totals .t{display:flex;justify-content:space-between;gap:10px}
.totals .grand{font-family:var(--display);font-size:24px;font-weight:700;border-top:2px solid var(--ink);padding-top:8px;margin-top:4px}
.breakdown{font-size:13px;background:var(--sunk);border-radius:8px;padding:10px 12px;display:grid;gap:3px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,20,12,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:820px}
.legal{max-height:60vh;overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:10px;padding-right:6px}
.legal h3{margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
[dir=rtl] .nav{text-align:right}
[dir=rtl] td,[dir=rtl] th{text-align:right}
@media print{.rail,.bottom,.tabs,button,.topbar .row,#toast{display:none!important}body{background:#fff}.main{padding:0}.card,.tablewrap{border-color:#ccc;break-inside:avoid}}
</style>

</head>

async function hashPin(pin,salt){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=5381;for(const c of salt+pin)h=((h<<5)+h+c.charCodeAt(0))|0;return "x"+h}
}

/* ============ calculations ============ */
function lineQty(it){const p=+it.pcs||0,L=+it.L||0;
  if(it.mode==="sawn")return L*(+it.W||0)*(+it.T||0)/144*p;
  if(it.mode==="log"){const G=+it.G||0;if(it.formula==="true"){const r=G/(2*Math.PI);return Math.PI*r*r*L/144*p}return (G/4)**2*L/144*p}
  if(it.mode==="rft")return L*p;
  return 0}
function lineCft(it){return it.mode==="rft"?(+it.L||0)*(+it.W||0)*(+it.T||0)/144*(+it.pcs||0):lineQty(it)}
function costBasis(woodId,kind){
  const s=S.data.settings;
  if(kind==="job")return{cost:s.sawing+s.labour,suggested:Math.ceil((s.sawing+s.labour)*(1+s.margin/100)/5)*5,parts:[["Sawing charge",s.sawing],["Labour",s.labour]]};
  const st=S.data.stock[woodId];const w=allWood(woodId);
  const buy=st?.buy||(w&&w.lo?Math.round(w.lo*.8):0);
  const waste=buy*s.wastage/100;
  const cost=buy+waste+s.sawing+s.labour;
  return{cost,buy,suggested:Math.ceil(cost*(1+s.margin/100)/5)*5,parts:[[st?.buy?"Your buying rate":"Estimated buying rate",buy],[`Wastage ${s.wastage}%`,waste],["Sawing",s.sawing],["Labour",s.labour]]};
}
function totals(o){
  const sub=o.items.reduce((a,it)=>a+lineQty(it)*(+it.rate||0),0);
  const taxable=Math.max(0,sub+(+o.transport||0)-(+o.discount||0));
  const gst=o.gstOn?taxable*S.data.settings.gst/100:0;
  const total=taxable+gst;
  return{sub,taxable,gst,total,balance:total-(+o.advance||0),cft:o.items.reduce((a,it)=>a+lineCft(it),0)};
}
function receivables(){return S.data.orders.reduce((a,o)=>["confirmed","cutting","delivered"].includes(o.status)?a+Math.max(0,totals(o).balance):a,0)}
function monthSales(){const mo=today().slice(0,7);return S.data.orders.reduce((a,o)=>o.date&&o.date.slice(0,7)===mo&&!["quote","cancelled"].includes(o.status)?a+totals(o).total:a,0)}
function stockCft(){return Object.values(S.data.stock).reduce((a,s)=>a+(+s.qty||0),0)}
function stockValue(){return Object.values(S.data.stock).reduce((a,s)=>a+(+s.qty||0)*(+s.sell||0),0)}
function lowStock(){return Object.entries(S.data.stock).filter(([k,s])=>(+s.min||0)>0&&(+s.qty||0)<=(+s.min||0))}

  const pool=[...WOODS.map(w=>W[w[0]]),...d.customWoods];

  return `<div class="topbar"><div><p class="label">Measured in cubic feet (CFT)</p><h1>${t("stock")}</h1></div><div class="row"><button class="btn" data-act="customWood">+ Wood not in list</button><button class="btn primary" data-act="stab" data-v="all">+ ${t("add")}</button></div></div>

function recalc(){
  const o=S.draft;if(!o)return;
  o.items.forEach((it,i)=>{const q=lineQty(it);const a=$("#a_"+i),qq=$("#q_"+i),s=$("#s_"+i);if(!a)return;
    qq.textContent=it.mode==="rft"?fx(q,1)+" rft · "+fx(lineCft(it))+" CFT":fx(q,3)+" CFT";a.textContent=inr(q*(+it.rate||0));
    const cb=costBasis(it.wood,o.kind);const perUnit=it.mode==="rft"?(+it.W||0)*(+it.T||0)/144:1;
    const sug=Math.round(cb.suggested*perUnit),be=Math.round(cb.cost*perUnit),r=+it.rate||0;
    const warn=r&&r<be?` <span style="color:var(--bad);font-weight:600">Below break-even (${inr(be)}).</span>`:"";
    const stk=o.kind==="sale"&&S.data.stock[it.wood]?` · In stock ${fx(S.data.stock[it.wood].qty,1)} CFT`+(lineCft(it)>S.data.stock[it.wood].qty?` <span style="color:var(--warn);font-weight:600">not enough</span>`:""):"";
    s.innerHTML=`Suggested <b class="num">${inr(sug)}</b>${it.mode==="rft"?"/rft":"/CFT"} · break-even ${inr(be)}${stk}${warn} <button class="btn ghost sm" style="padding:0 4px;min-height:0" data-act="useSug" data-i="${i}" data-v="${sug}">Use suggested</button>`;
  });
  const it0=o.items[0];if(it0){const cb=costBasis(it0.wood,o.kind);
  $("#bd").innerHTML=`<div class="row between"><b>${esc(o.kind==="job"?"Job work rate":woodName(it0.wood))}</b><span class="muted">per CFT</span></div>`+cb.parts.map(([l,v])=>`<div class="row between"><span>${esc(l)}</span><span class="num">${inr(v)}</span></div>`).join("")+
    `<div class="row between" style="border-top:1px solid var(--line);padding-top:3px"><span>Break-even</span><span class="num">${inr(cb.cost)}</span></div><div class="row between"><span>+ Margin ${S.data.settings.margin}%</span><b class="num">${inr(cb.suggested)}</b></div>`}
  const tt=totals(o);const half=tt.gst/2;
  $("#tot").innerHTML=`<div class="t"><span>Total volume</span><span class="num">${fx(tt.cft,3)} CFT</span></div>
    <div class="t"><span>Items</span><span class="num">${inr(tt.sub)}</span></div>
    ${+o.transport?`<div class="t"><span>Transport</span><span class="num">${inr(o.transport)}</span></div>`:""}
    ${+o.discount?`<div class="t"><span>Discount</span><span class="num">− ${inr(o.discount)}</span></div>`:""}
    <div class="t"><span>Taxable value</span><span class="num">${inr(tt.taxable)}</span></div>
    ${o.gstOn?(S.data.settings.gstMode==="intra"?`<div class="t"><span>CGST ${S.data.settings.gst/2}%</span><span class="num">${inr(half)}</span></div><div class="t"><span>SGST ${S.data.settings.gst/2}%</span><span class="num">${inr(half)}</span></div>`:`<div class="t"><span>IGST ${S.data.settings.gst}%</span><span class="num">${inr(tt.gst)}</span></div>`):""}
    <div class="t grand"><span>${t("total")}</span><span class="num">${inr(tt.total)}</span></div>
    ${+o.advance?`<div class="t"><span>Advance</span><span class="num">− ${inr(o.advance)}</span></div><div class="t"><b>Balance due</b><b class="num">${inr(tt.balance)}</b></div>`:""}`;
  const sn=$("#stockNote");if(sn)sn.textContent=o.deducted&&o.kind==="sale"?"Stock was reduced for this order. Changing quantities will not adjust stock — use Stock in/out to correct it.":"";
}

function quoteText(o){
  const d=S.data,tt=totals(o);
  const L=[`*${d.profile.mill}*`,`${d.profile.district?d.profile.district+", ":""}${d.profile.state}${d.profile.gstin?" · GSTIN "+d.profile.gstin:""}`,`Estimate #${o.no} · ${fdate(o.date)}`,o.customer?`${t("customer")}: ${o.customer}`:"",""];
  o.items.forEach((it,i)=>{const q=lineQty(it);const size=it.mode==="log"?`girth ${it.G}″ × ${it.L}′`:`${it.L}′ × ${it.W}″ × ${it.T}″`;
    L.push(`${i+1}. ${woodName(it.wood)} — ${size} × ${it.pcs} pcs`,`   ${fx(q,3)} ${it.mode==="rft"?"rft":"CFT"} @ ${inr(it.rate)} = ${inr(q*it.rate)}`)});
  L.push("",`Total volume: ${fx(tt.cft,3)} CFT`);
  if(+o.transport)L.push(`Transport: ${inr(o.transport)}`);
  if(+o.discount)L.push(`Discount: −${inr(o.discount)}`);
  if(o.gstOn)L.push(`GST ${d.settings.gst}%: ${inr(tt.gst)}`);
  L.push(`*${t("total")}: ${inr(tt.total)}*`);
  if(+o.advance)L.push(`Advance: ${inr(o.advance)} · Balance: ${inr(tt.balance)}`);
  if(o.notes)L.push("Note: "+o.notes);
  L.push("",o.kind==="job"?"Sawing charges only. Customer's own timber.":"Rates valid for 7 days, subject to stock.",`Contact: ${d.profile.mobile}`);
  return L.filter((x,i)=>x!==""||L[i-1]!=="").join("\n");
}

async function loadAccounts(){S.accounts=(await Store.get("accounts"))||{}}
async function enter(mobile,data){S.acct=mobile;S.data=migrate(data);S.screen="app";S.tab="home";try{sessionStorage.setItem("aara:session",mobile)}catch(e){}render()}
function deductStock(o){const short=[];o.items.forEach(it=>{const s=S.data.stock[it.wood];if(s){const c=lineCft(it);if(c>+s.qty)short.push(woodName(it.wood));s.qty=Math.max(0,Math.round(((+s.qty||0)-c)*100)/100);logMove({id:uid(),date:today(),wood:it.wood,delta:-c,note:"Order #"+o.no+(o.customer?" · "+o.customer:"")})}});o.deducted=true;return short}
function restoreStock(o){o.items.forEach(it=>{const s=S.data.stock[it.wood];if(s){const c=lineCft(it);s.qty=Math.round(((+s.qty||0)+c)*100)/100;logMove({id:uid(),date:today(),wood:it.wood,delta:c,note:"Order #"+o.no+" removed — stock added back"})}})}
const cftByWood=o=>{const m={};o.items.forEach(it=>{m[it.wood]=(m[it.wood]||0)+lineCft(it)});return m};
function adjustStock(prev,o){const a=cftByWood(prev),b=cftByWood(o);
  new Set([...Object.keys(a),...Object.keys(b)]).forEach(w=>{const diff=(b[w]||0)-(a[w]||0);if(Math.abs(diff)<1e-9)return;const s=S.data.stock[w];if(!s)return;
    s.qty=Math.max(0,Math.round((s.qty-diff)*100)/100);logMove({id:uid(),date:today(),wood:w,delta:-diff,note:"Order #"+o.no+" updated"})})}

function saveDraft(){const o=S.draft;
  const i=S.data.orders.findIndex(x=>x.id===o.id);const prev=i>=0?S.data.orders[i]:null;
  if(prev&&prev.deducted&&prev.kind==="sale"){
    if(o.kind==="job"||o.status==="cancelled"){restoreStock(prev);o.deducted=false}
    else adjustStock(prev,o);
  }
  else if(o.kind==="sale"&&!o.deducted&&!["quote","cancelled"].includes(o.status))deductStock(o);
  const c=JSON.parse(JSON.stringify(o));delete c.saved;delete c.dirty;o.dirty=false;
  if(i>=0)S.data.orders[i]=c;else{S.data.orders.push(c);S.data.seq=Math.max(S.data.seq,o.no)+1}o.saved=true;persist()}

  import(el){const f=el.files&&el.files[0];el.value="";if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const j=JSON.parse(r.result);const d=j&&j.data&&typeof j.data==="object"?j.data:j;
      if(!d||typeof d!=="object"||Array.isArray(d))throw 0;
      S.pendingImport=d;const mill=d.profile&&d.profile.mill?d.profile.mill:"(unnamed mill)";
      openModal(`<div class="stack"><h2>Restore backup?</h2><p>Backup for <b>${esc(mill)}</b>: ${(d.orders||[]).length} orders, ${(d.people||[]).length} people, ${Object.keys(d.stock||{}).length} woods in stock.</p><p class="muted small">This replaces ALL current data for this mill. Export a backup of today's data first if unsure.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">${t("cancel")}</button><button class="btn danger" data-act="doImport">Replace data</button></div></div>`)
    }catch(e){toast("That file is not a valid Aara backup")}};
    r.readAsText(f)},
  astatus(el){S.data.auctions.find(a=>a.id===el.dataset.id).status=el.value;persist();toast("Status updated")},
  aucst(el){S.auctionState=el.value;render()},
  woodCat(el){S.woodCat=el.value;render()},
  okind(el){S.draft.kind=el.value;S.draft.gstOn=true;S.draft.dirty=true;S.draft.items.forEach(it=>it.rate=costBasis(it.wood,el.value).suggested);render()},
  lwood(el){const v=el.value;if(v.startsWith("__")){render();return}const it=S.draft.items[+el.dataset.i];it.wood=v;const r=costBasis(v,S.draft.kind).suggested;it.rate=it.mode==="rft"?Math.round(r*(+it.W||0)*(+it.T||0)/144):r;S.draft.dirty=true;render()},
  lmode(el){const it=S.draft.items[+el.dataset.i];it.mode=el.value;const r=costBasis(it.wood,S.draft.kind).suggested;it.rate=it.mode==="rft"?Math.round(r*(+it.W||0)*(+it.T||0)/144):r;S.draft.dirty=true;render()},

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const f=ACT[el.dataset.act];if(f){if(el.tagName==="BUTTON"&&el.type!=="submit")e.preventDefault();f(el,e)}});

  if(e.key==="Escape"&&$("#modal").innerHTML)closeModal();
  if(e.key!=="Tab")return;const md=document.querySelector("#modal .modal");if(!md)return;
  const f=[...md.querySelectorAll("button,input,select,textarea,a[href]")].filter(x=>!x.disabled&&x.offsetParent!==null);
  if(!f.length)return;const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}
  else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}});

document.addEventListener("submit",async e=>{e.preventDefault();const form=e.target,kind=form.dataset.form;const fd=Object.fromEntries(new FormData(form));const d=S.data;
  const err=(m)=>{const x=form.querySelector("#authErr,#formErr");if(x)x.textContent=m};
  if(kind==="signup"){
    const mob=normMobile(fd.mobile);
    if(!fd.mill||!fd.owner)return err("Enter the mill name and owner name.");
    if(!/^[6-9]\d{9}$/.test(mob))return err("Enter a valid 10-digit Indian mobile number.");
    if(!/^\d{4,6}$/.test(fd.pin||""))return err("PIN must be 4 to 6 digits.");
    if(!fd.state)return err("Choose your state.");
    if(fd.gstin&&!/^\d{2}[A-Z]{5}\d{4}[A-Z][A-Z\d]Z[A-Z\d]$/i.test(fd.gstin))return err("GSTIN should be 15 characters, like 23ABCDE1234F1Z5. Leave it blank if you don't have one.");
    if(!fd.agree)return err("Please accept the Terms of Use and Privacy Policy to continue.");
    await loadAccounts();if(S.accounts[mob])return err("An account with this mobile number already exists. Log in instead.");
    const salt=uid();S.accounts[mob]={salt,hash:await hashPin(fd.pin,salt),createdAt:today(),consent:{terms:new Date().toISOString(),alerts:!!fd.alerts}};
    await Store.set("accounts",S.accounts);
    const m=newMill({mill:fd.mill.trim(),owner:fd.owner.trim(),mobile:mob,state:fd.state,district:fd.district,licence:fd.licence,gstin:(fd.gstin||"").toUpperCase()});
    m.people.push({id:uid(),type:"owner",name:fd.owner.trim(),role:"Owner",phone:mob,share:100,active:true,joined:today(),present:{}});
    await Store.set("mill_"+mob,m);toast("Account created");return enter(mob,m)}
  if(kind==="login"){
    const mob=normMobile(fd.mobile);await loadAccounts();const a=S.accounts[mob];
    if(!a)return err("No account found for this number. Sign up first, or try the sample mill.");
    const rec=(await Store.get("fail_"+mob))||{n:0,until:0};
    if(Date.now()<rec.until)return err("Too many wrong PINs. Try again in "+Math.ceil((rec.until-Date.now())/6e4)+" min.");
    if(await hashPin(fd.pin||"",a.salt)!==a.hash){rec.n++;
      if(rec.n>=5){rec.until=Date.now()+5*6e4;rec.n=0}else rec.until=0;
      await Store.set("fail_"+mob,rec);return err("Wrong PIN. Try again."+(rec.n?" "+(5-rec.n)+" tries left.":""))}
    if(rec.n||rec.until)await Store.del("fail_"+mob);
    const m=await Store.get("mill_"+mob);if(!m)return err("Account found but mill data is missing on this device.");return enter(mob,m)}
  if(kind==="pin"){await loadAccounts();const a=S.accounts[S.acct];
    if(!a)return err("PIN can only be changed on your own account.");
    if(await hashPin(fd.old||"",a.salt)!==a.hash)return err("Current PIN is wrong.");
    if(!/^\d{4,6}$/.test(fd.pin1||""))return err("New PIN must be 4 to 6 digits.");
    if(fd.pin1!==fd.pin2)return err("The new PINs do not match.");
    const salt=uid();a.salt=salt;a.hash=await hashPin(fd.pin1,salt);
    await Store.set("accounts",S.accounts);closeModal();toast("PIN changed");return}
  if(kind==="person"){
    if(!fd.name)return err("Enter a name.");
    fd.phone=normMobile(fd.phone);
    if(fd.phone&&!/^\d{10}$/.test(fd.phone))return err("Phone should be 10 digits.");
    if(fd.aadhaar4&&!/^\d{4}$/.test(fd.aadhaar4))return err("Enter only the last 4 digits of Aadhaar.");
    if(form.dataset.type==="labour"&&!fd.consent)return err("Confirm that the worker has agreed to their details being recorded.");
    const id=form.dataset.id;const base=id?d.people.find(p=>p.id===id):{id:uid(),type:form.dataset.type,present:{}};
    Object.assign(base,{name:fd.name.trim(),phone:fd.phone,role:fd.role,joined:fd.joined,address:fd.address,emergency:fd.emergency,active:!!fd.active,
      ...(base.type==="labour"?{wageType:fd.wageType,wage:+fd.wage||0,esic:fd.esic,aadhaar4:fd.aadhaar4}:{share:+fd.share||0,pan:(fd.pan||"").toUpperCase()})});
    if(!id)d.people.push(base);closeModal();persist();render();toast(t("save")+" ✓")}
  if(kind==="auction"){const id=form.dataset.id;const base=id?d.auctions.find(a=>a.id===id):{id:uid()};Object.assign(base,{...fd,emd:+fd.emd||0,link:safeUrl(fd.link)});if(!id)d.auctions.push(base);closeModal();persist();render();toast("Saved to your diary")}
  if(kind==="stock"){const id=form.dataset.id;const was=d.stock[id];d.stock[id]={form:fd.form,qty:+fd.qty||0,buy:+fd.buy||0,sell:+fd.sell||0,min:+fd.min||0};
    if(!was&&+fd.qty)logMove({id:uid(),date:today(),wood:id,delta:+fd.qty,note:"Opening stock"});
    if(was&&+fd.qty!==+was.qty)logMove({id:uid(),date:today(),wood:id,delta:+fd.qty-(+was.qty||0),note:"Stock count corrected"});
    closeModal();S.stockTab="mine";persist();render();toast(woodName(id)+" saved")}
  if(kind==="move"){const id=form.dataset.id,q=+fd.qty||0;if(q<=0)return;const s=d.stock[id];const delta=form.dataset.dir==="in"?q:-Math.min(q,+s.qty||0);
    s.qty=Math.round(((+s.qty||0)+delta)*100)/100;logMove({id:uid(),date:fd.date||today(),wood:id,delta,note:fd.note||(delta>0?"Stock in":"Stock out")});closeModal();persist();render()}
  if(kind==="customWood"){const id="c_"+uid();d.customWoods.push({id,en:fd.en.trim(),hn:fd.hn,uses:fd.uses,cat:"",lo:0,max:0});closeModal();persist();openModal(stockForm(id))}
  if(kind==="profile"){Object.assign(d.profile,{mill:fd.mill,owner:fd.owner,state:fd.state,district:fd.district,licence:fd.licence,licenceExp:fd.licenceExp,gstin:(fd.gstin||"").toUpperCase()});persist();render();toast("Profile saved")}
  if(kind==="pricing"){for(const k of ["wastage","sawing","labour","margin","gst","workDays"])d.settings[k]=+fd[k]||0;d.settings.gstMode=fd.gstMode;persist();render();toast("Pricing saved")}
});

/* ============ boot ============ */
(async()=>{
  render();
  if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
  await loadAccounts();
  let sess=null;try{sess=sessionStorage.getItem("aara:session")}catch(e){}
  if(sess){const m=await Store.get("mill_"+sess);if(m){S.acct=sess;S.data=migrate(m);S.screen="app";
    const h=(location.hash||"").slice(1);if(["people","auctions","stock","orders","more"].includes(h))S.tab=h;render();return}}
  S.screen="auth";render();
})();
</script>
