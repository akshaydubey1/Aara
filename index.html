<title>Aara Sawmill Manager</title>
<meta name="theme-color" content="#24563A">
<meta property="og:type" content="website">
<meta property="og:title" content="Aara — Sawmill Manager for India">
<meta property="og:description" content="People, auctions, timber stock, CFT estimates, profit tracking and letterhead PDFs — works offline, installs to your home screen.">
<meta property="og:url" content="https://akshaydubey1.github.io/Aara/">
<meta property="og:image" content="https://akshaydubey1.github.io/Aara/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Hind:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: app shell — left rail on desktop, bottom tab bar on phones; content column max 1120px. */
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --sunk:#E7EBE3; --ink:#1B231D; --muted:#58665B; --line:#D6DCD2;
  --forest:#24563A; --forest-ink:#FFFFFF; --chalk:#E2AC22; --chalk-ink:#2A1E00;
  --ok:#2E7D4F; --ok-bg:#E3F2E8; --warn:#9A5B00; --warn-bg:#FBEFD9; --bad:#B3261E; --bad-bg:#FBE4E2; --info:#2B5C8A; --info-bg:#E2ECF6;
  --display:"Rajdhani","Hind",system-ui,sans-serif; --body:"Hind",system-ui,-apple-system,"Segoe UI","Noto Sans",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,40,25,.06),0 4px 14px rgba(20,40,25,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111612; --surface:#192019; --sunk:#141A15; --ink:#E6ECE5; --muted:#9BA99E; --line:#2B352D;
  --forest:#79C493; --forest-ink:#0B1A10; --chalk:#F0C24A; --chalk-ink:#2A1E00;
  --ok:#7FD39E; --ok-bg:#16301F; --warn:#F2B865; --warn-bg:#33270F; --bad:#FF8F86; --bad-bg:#3A1714; --info:#8DBBE8; --info-bg:#132637;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111612; --surface:#192019; --sunk:#141A15; --ink:#E6ECE5; --muted:#9BA99E; --line:#2B352D;
  --forest:#79C493; --forest-ink:#0B1A10; --chalk:#F0C24A; --chalk-ink:#2A1E00;
  --ok:#7FD39E; --ok-bg:#16301F; --warn:#F2B865; --warn-bg:#33270F; --bad:#FF8F86; --bad-bg:#3A1714; --info:#8DBBE8; --info-bg:#132637;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;font-weight:700} h2{font-size:22px;font-weight:700} h3{font-size:17px;font-weight:600}
p{margin:0}
a{color:var(--forest)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* end-grain mark: growth rings of a log */
.rings{width:44px;height:44px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 46% 54%,var(--chalk) 0 9%,transparent 10%),
  repeating-radial-gradient(circle at 46% 54%,var(--forest) 0 2px,transparent 2px 5px),var(--surface);
  box-shadow:inset 0 0 0 3px var(--forest)}
.rings.big{width:120px;height:120px;box-shadow:inset 0 0 0 6px var(--forest)}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--forest)}
.btn.primary{background:var(--forest);color:var(--forest-ink);border-color:var(--forest)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.chalk{background:var(--chalk);color:var(--chalk-ink);border-color:var(--chalk);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--forest)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.icon{width:36px;min-height:36px;padding:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px}
input:focus,select:focus,textarea:focus{border-color:var(--forest);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--forest) 20%,transparent)}
input[type=checkbox]{width:18px;min-height:18px;accent-color:var(--forest)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:720px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;flex:none}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flat{box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)}
.p-info{background:var(--info-bg);color:var(--info)} .p-neutral{background:var(--sunk);color:var(--muted)}
/* painted lot mark, the way forest depots number logs */
.lot{display:inline-block;background:var(--chalk);color:var(--chalk-ink);font-family:var(--mono);font-weight:600;font-size:12px;padding:1px 7px;border-radius:3px;transform:rotate(-1.5deg)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;font-weight:500;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r);background:var(--info-bg);color:var(--info);font-size:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}

/* auth */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth-brand{background:var(--forest);color:var(--forest-ink);padding-block:48px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:32px;display:flex;flex-direction:column;gap:28px;justify-content:center}
.auth-brand .rings{box-shadow:inset 0 0 0 6px var(--forest-ink);background:radial-gradient(circle at 46% 54%,var(--chalk) 0 9%,transparent 10%),repeating-radial-gradient(circle at 46% 54%,var(--forest-ink) 0 2px,transparent 2px 6px),var(--forest)}
.auth-brand h1{font-size:44px}
.auth-brand ul{margin:0;padding:0;list-style:none;display:grid;gap:12px;max-width:440px}
.auth-brand li{display:flex;gap:10px;opacity:.95}
.auth-brand li b{font-family:var(--display);font-size:17px}
.auth-form{padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:center}
.auth-card{width:100%;max-width:440px}
@media (max-width:820px){.auth{grid-template-columns:minmax(0,1fr)}.auth-brand{padding:28px max(16px,env(safe-area-inset-left,0px)) 28px max(16px,env(safe-area-inset-right,0px));gap:14px}.auth-brand h1{font-size:34px}.auth-brand ul{display:none}.auth-form{padding:20px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.rail .brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.rail .brand b{font-family:var(--display);font-size:22px;line-height:1}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:0;background:transparent;cursor:pointer;text-align:left;color:var(--muted);font-weight:500;width:100%}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current=page]{background:color-mix(in srgb,var(--forest) 14%,transparent);color:var(--forest);font-weight:600}
.main{padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.main>.inner{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.bottom{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main{padding-bottom:96px}
  .bottom{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .bottom .nav{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;text-align:center;justify-content:center}
  .bottom .nav span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1}
.kpi .s{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:960px){.two{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it>div{min-width:0}
.person{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-family:var(--display);font-weight:700;color:var(--forest)}
.wood{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:baseline}

/* estimate */
.line{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) repeat(4,minmax(0,.7fr)) minmax(0,.9fr) minmax(0,.9fr) 36px;gap:8px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line)}
.line .out{min-height:40px;display:flex;flex-direction:column;justify-content:center}
@media (max-width:980px){.line{grid-template-columns:repeat(4,minmax(0,1fr))}.line .wide{grid-column:span 2}}
@media (max-width:440px){.line{grid-template-columns:repeat(2,minmax(0,1fr))}}
.totals{display:grid;gap:6px}
.totals .t{display:flex;justify-content:space-between;gap:10px}
.totals .grand{font-family:var(--display);font-size:24px;font-weight:700;border-top:2px solid var(--ink);padding-top:8px;margin-top:4px}
.breakdown{font-size:13px;background:var(--sunk);border-radius:8px;padding:10px 12px;display:grid;gap:3px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,20,12,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:820px}
.legal{max-height:60vh;overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:10px;padding-right:6px}
.legal h3{margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
[dir=rtl] .nav{text-align:right}
[dir=rtl] td,[dir=rtl] th{text-align:right}
/* price & profit controls */
input[type=range]{min-height:0;padding:0;border:0;accent-color:var(--forest);height:28px;background:transparent;box-shadow:none}
.dial{display:grid;gap:4px}
.dial .val{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:4px;background:var(--info-bg);color:var(--info)}
details>summary{cursor:pointer;color:var(--forest);font-weight:500;font-size:14px}
.neg-box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;font-size:14px}
/* attendance register */
.reg{border-collapse:separate;border-spacing:0;font-size:12px}
.reg th,.reg td{padding:0;text-align:center;border-bottom:1px solid var(--line);background:var(--surface)}
.reg th{padding:6px 2px;font-size:11px;background:var(--sunk)}
.reg th.sun{color:var(--bad)}
.reg .nm{position:sticky;left:0;z-index:1;text-align:left;padding:6px 10px;min-width:150px;max-width:180px;border-right:1px solid var(--line)}
.reg td.sum{padding:6px 8px;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
.att{width:28px;height:30px;border:0;border-radius:5px;margin:2px 1px;cursor:pointer;font-weight:700;font-size:12px;background:transparent;color:var(--muted)}
.att:hover{outline:1px solid var(--line)}
.att[disabled]{cursor:default;opacity:.35}
.att.P{background:var(--ok-bg);color:var(--ok)} .att.H{background:var(--warn-bg);color:var(--warn)} .att.A{background:var(--bad-bg);color:var(--bad)} .att.L{background:var(--info-bg);color:var(--info)}
.att.sun:not(.P):not(.H):not(.A):not(.L){color:var(--bad);opacity:.6}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;align-items:center}
.legend .att{cursor:default;width:auto;padding:0 6px;height:22px}
/* backup */
.freq{display:flex;gap:6px;flex-wrap:wrap}
.freq label{border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px;display:flex;gap:6px;align-items:center}
.freq label:has(input:checked){border-color:var(--forest);background:color-mix(in srgb,var(--forest) 12%,transparent);color:var(--forest);font-weight:600}
.freq input{width:auto;min-height:0;accent-color:var(--forest)}
/* customers & whatsapp */
.wa{background:#1F8F4E;color:#fff;border-color:#1F8F4E}
.wa:hover{filter:brightness(1.08);border-color:#1F8F4E}
.wa svg{width:16px;height:16px}
.msg{white-space:pre-wrap;background:var(--sunk);border-radius:10px;padding:12px;font-size:14px;max-height:240px;overflow:auto}
.tplgrid{display:grid;gap:12px}
/* profit report */
.wf{display:grid;gap:2px;font-size:14px}
.wf .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.wf .r.sum{border-bottom:0;border-top:2px solid var(--ink);font-weight:600;padding-top:8px}
.wf .r.neg span:last-child{color:var(--bad)}
.wf .r.big{font-family:var(--display);font-size:22px;font-weight:700}
.meter{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--forest);border-radius:999px}
.minibar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:60px}
.minibar>i{display:block;height:100%;background:var(--chalk)}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.logo-prev{width:120px;height:72px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;background:#fff;overflow:hidden}
.logo-prev img{max-width:100%;max-height:100%;object-fit:contain}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.swatches i{width:22px;height:22px;border-radius:50%;display:inline-block}
/* printed estimate: deliberately a white paper document in both themes */
.paperwrap{overflow-x:auto;background:var(--sunk);padding:12px;border-radius:10px}
.paper{background:#ffffff;color:#1d1d1d;width:794px;min-height:1000px;margin:0 auto;padding:40px 44px;font-family:"Hind",system-ui,sans-serif;font-size:13px;line-height:1.45;display:flex;flex-direction:column;gap:16px}
.paper .ph{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.paper .pl{display:flex;gap:14px;align-items:center}
.paper .pl img{max-height:72px;max-width:150px;object-fit:contain}
.paper .pn{font-family:"Rajdhani","Hind",sans-serif;font-weight:700;font-size:28px;line-height:1.05;color:var(--brand)}
.paper .pt{color:#555;font-size:13px}
.paper .pc{text-align:right;font-size:12px;color:#333}
.paper .prule{height:4px;background:var(--brand);border-radius:2px}
.paper .pmeta{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.paper .pk{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#666;font-weight:600}
.paper .pbig{font-family:"Rajdhani",sans-serif;font-size:22px;font-weight:700}
.paper .pr{text-align:right}
.paper .pto{border:1px solid #ddd;border-radius:6px;padding:10px 12px;max-width:340px}
.paper table{width:100%;border-collapse:collapse;font-size:12.5px}
.paper th{background:var(--brand);color:#fff;text-align:left;padding:7px 8px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;border:0}

const Store={db:null,uid:null,
  async init(){
    try{if(localStorage.getItem("aara:cloud")){await loadScript("sync.js");if(window.AaraSync)await window.AaraSync.boot(Store)}}catch(e){S.mode="device"}
  },
  ref(k){return this.db.collection("data/users/"+this.uid).doc(k)},
  async get(k){
    if(this.db){try{const s=await this.ref(k).get();if(s.exists){const v=s.data().v;if(v===null){try{localStorage.removeItem("aara:"+k)}catch(e){}return null}try{localStorage.setItem("aara:"+k,JSON.stringify(v))}catch(e){}return v}}catch(e){}}
    try{const v=localStorage.getItem("aara:"+k);return v?JSON.parse(v):null}catch(e){return null}
  },
  async set(k,v){const t=Date.now();let ok=true;
    try{localStorage.setItem("aara:"+k,JSON.stringify(v));localStorage.setItem("aarat:"+k,String(t))}catch(e){toast("Could not save — browser storage may be full. Export a backup from More.");ok=false}
    if(this.db){try{await this.ref(k).set({v,t})}catch(e){toast("Could not save online — saved on this device; will sync when reconnected.")}}
    return ok
  },
  async del(k){
    // A tombstone is a write, so RLS cannot restrict it — gate it here by role.
    if(S.mode==="cloud"&&S.role==="munshi"&&!k.startsWith("fail_")){toast("Only the owner or a partner can delete records.");return}
    // Keep the timestamp as a tombstone so the sync layer can propagate the
    // delete; removing it would let a pull resurrect the key.
    try{localStorage.removeItem("aara:"+k);localStorage.setItem("aarat:"+k,String(Date.now()))}catch(e){}
    if(this.db){try{await this.ref(k).set({v:null,t:Date.now()})}catch(e){}}
  }
};
// Local write timestamps — used by the sync layer for last-write-wins merges.
Store.localT=k=>{try{return +(localStorage.getItem("aarat:"+k)||0)}catch(e){return 0}};
/* The sync scope: which mill's document namespace this device writes to.
   Solo/device mode = the account mobile; joined cloud mode = the mill id. */
function scope(fb){return S.mode==="cloud"&&window.AaraSync&&window.AaraSync.millId()?window.AaraSync.millId():(S.acct||fb||"local")}

/* Mill data is persisted as one record per sync key — orders, people,
   customers, stock items, by-products, auctions, moves and month advances are
   each their own record, with settings/profile/etc. under a `core_` doc and
   an `idx_` manifest of ids. Two devices can then edit different records
   without ever overwriting each other; conflicts resolve per record.
   A legacy monolithic `mill_<acct>` doc is still read as a fallback. */
Store.setMill=async function(sc,d){
  const recs={["core_"+sc]:{profile:d.profile,settings:d.settings,backup:d.backup,wa:d.wa,customWoods:d.customWoods,seq:d.seq,demoV:d.demoV}};
  const idx={};
  const put=(pre,arr)=>{idx[pre]=[];(arr||[]).forEach(r=>{idx[pre].push(r.id);recs[pre+"_"+sc+"_"+r.id]=r})};
  put("ord",d.orders);put("per",d.people);put("cus",d.customers);put("auc",d.auctions);put("mov",d.moves);
  idx.stk=Object.keys(d.stock||{});idx.stk.forEach(k=>{recs["stk_"+sc+"_"+k]=d.stock[k]});
  idx.byp=Object.keys(d.byp||{});idx.byp.forEach(k=>{recs["byp_"+sc+"_"+k]=d.byp[k]});
  idx.adv=Object.keys(d.advances||{});idx.adv.forEach(k=>{recs["adv_"+sc+"_"+k]=d.advances[k]});
  recs["idx_"+sc]=idx;
  this._h=this._h||{};
  // Diff against the LOCAL manifest — remote's idx may be newer and would
  // generate false tombstones.
  let prev=null;try{const v=localStorage.getItem("aara:idx_"+sc);prev=v?JSON.parse(v):null}catch(e){}
  const batch=[];
  for(const k in recs){const j=JSON.stringify(recs[k]);if(this._h[k]===j)continue;this._h[k]=j;batch.push([k,recs[k]])}
  if(prev)for(const pre in idx)(prev[pre]||[]).forEach(id=>{if(!idx[pre].includes(id))batch.push([pre+"_"+sc+"_"+id,null])});
  await this.setMany(batch);
};
Store.getMill=async function(sc){
  const idx=await this.get("idx_"+sc);
  if(!idx)return this.get("mill_"+sc);          // legacy monolith
  const d=(await this.get("core_"+sc))||{};if(!d.profile)return null;
  // Record ids come from the manifest UNION the local keyspace — a stale or
  // hostile manifest can never hide a synced record.
  const ids={};const addIds=(pre,arr)=>{(ids[pre]=ids[pre]||new Set());(arr||[]).forEach(id=>ids[pre].add(id))};
  for(const pre in idx)addIds(pre,idx[pre]);
  try{for(let i=0;i<localStorage.length;i++){const sk=localStorage.key(i);
    if(!sk||!sk.startsWith("aara:"))continue;const k=sk.slice(5),p=k.match(/^(ord|per|cus|auc|mov|stk|byp|adv)_(.+)$/);
    if(p){const ppre=p[1],rest=p[2];if(rest.startsWith(sc+"_"))addIds(ppre,[rest.slice(sc.length+1)])}}}catch(e){}
  const grab=async pre=>{const out=[];for(const id of ids[pre]||[]){const r=await this.get(pre+"_"+sc+"_"+id);if(r!=null)out.push(r)}return out};
  d.orders=await grab("ord");d.people=await grab("per");d.customers=await grab("cus");d.auctions=await grab("auc");d.moves=await grab("mov");
  d.stock={};for(const k of ids.stk||[]){const r=await this.get("stk_"+sc+"_"+k);if(r!=null)d.stock[k]=r}
  d.byp={};for(const k of ids.byp||[]){const r=await this.get("byp_"+sc+"_"+k);if(r!=null)d.byp[k]=r}
  d.advances={};for(const k of ids.adv||[]){const r=await this.get("adv_"+sc+"_"+k);if(r!=null)d.advances[k]=r}
  return d;
};
Store.delMill=async function(sc){
  const idx=await this.get("idx_"+sc),ks=new Set(["idx_"+sc,"core_"+sc,"mill_"+sc]);
  if(idx){for(const pre in idx)(idx[pre]||[]).forEach(id=>ks.add(pre+"_"+sc+"_"+id))}
  // Union with the local keyspace — a record adopted remotely but missing
  // from the manifest must still be tombstoned, or a pull would resurrect it.
  try{for(let i=0;i<localStorage.length;i++){const sk=localStorage.key(i);
    if(!sk||!sk.startsWith("aara:"))continue;const k=sk.slice(5),p=k.match(/^(ord|per|cus|auc|mov|stk|byp|adv|att)_(.+)$/);
    if(p&&p[2].startsWith(sc+"_"))ks.add(k)}}catch(e){}
  for(const k of ks)await this.del(k);
};
Store.setMany=async function(kvs){const t=Date.now();let ok=true;
  for(const [k,v] of kvs){try{if(v===null)localStorage.removeItem("aara:"+k);else localStorage.setItem("aara:"+k,JSON.stringify(v));localStorage.setItem("aarat:"+k,String(t))}catch(e){ok=false}}
  if(!ok)toast("Could not save — browser storage may be full. Export a backup from More.");
  if(this.db&&kvs.length){try{
    if(this.db.batch)await this.db.batch(kvs.map(([k,v])=>({key:k,v,t})));
    else for(const [k,v] of kvs)await this.ref(k).set({v,t});
  }catch(e){toast("Could not save online — saved on this device; will sync when reconnected.")}}
  return ok};

/* ============ calculations ============ */
function lineQty(it){if(it.mode==="byp")return +it.q||0;const p=+it.pcs||0,L=+it.L||0;
  if(it.mode==="sawn")return L*(+it.W||0)*(+it.T||0)/144*p;
  if(it.mode==="log"){const G=+it.G||0;if(it.formula==="true"){const r=G/(2*Math.PI);return Math.PI*r*r*L/144*p}return (G/4)**2*L/144*p}
  if(it.mode==="rft")return L*p;
  return 0}
function lineCft(it){if(it.mode==="byp")return 0;return it.mode==="rft"?(+it.L||0)*(+it.W||0)*(+it.T||0)/144*(+it.pcs||0):lineQty(it)}
/* Cost per CFT sold. material = timber cost after sawing loss; processing = per-CFT sawing + labour estimate.
   Profit reports use material only and then subtract real wages and overheads, so nothing is counted twice. */
function bypOf(id){return (S.data.byp||{})[id]}
function itemName(it){return it.mode==="byp"?(bypOf(it.wood)?.en||"By-product"):woodName(it.wood)}
function itemUnit(it){return it.mode==="byp"?(bypOf(it.wood)?.unit||"unit"):it.mode==="rft"?"rft":"CFT"}
function itemGst(it){return it.mode==="byp"?(+(bypOf(it.wood)?.gst)||0):S.data.settings.gst}
function orderQtyText(o){const tt=totals(o);if(tt.cft)return fx(tt.cft)+" CFT";const it=(o.items||[]).find(i=>i.mode==="byp");return it?fx(lineQty(it),1)+" "+itemUnit(it):"—"}
function marginFor(woodId,o){if(o&&o.margin!=null&&o.margin!=="")return +o.margin;const st=S.data.stock[woodId];return st&&st.margin!=null&&st.margin!==""?+st.margin:S.data.settings.margin}
function unitCost(woodId,kind,mode,ov){
  const s=S.data.settings;
  if(mode==="byp")return{material:0,cost:0,parts:[["By-product: its cost is already inside the timber",0]]};
  if(kind==="job")return{material:0,cost:s.sawing+s.labour,parts:[["Sawing / machine",s.sawing],["Labour",s.labour]]};
  const st=ov?{...(S.data.stock[woodId]||{}),...ov}:S.data.stock[woodId],w=allWood(woodId);
  const base=ov&&ov.base!=null?+ov.base:st?(+st.avg||+st.buy||0):(w&&w.lo?Math.round(w.lo*.8):0);
  const parts=[[st?(st.avg?"Average landed cost":"Buying rate"):"Estimated buying rate",base]];
  let material=base;
  if(st&&st.form==="log"&&mode!=="log"){const rec=Math.min(100,Math.max(1,+s.recovery||60));const loss=base*(100/rec-1);parts.push([`Log → sawn loss (${rec}% recovery)`,loss]);material+=loss}
  else if(mode!=="log"){const waste=base*s.wastage/100;parts.push([`Wastage ${s.wastage}%`,waste]);material+=waste}
  let cost=material;
  if(mode!=="log"){cost+=s.sawing;parts.push(["Sawing / machine",s.sawing])}
  cost+=s.labour;parts.push(["Labour",s.labour]);
  return{material,cost,parts};
}
function costBasis(woodId,kind,mode,m){if(mode==="byp"){const b=bypOf(woodId);return{material:0,cost:0,parts:[],suggested:+(b&&b.rate)||0,margin:0}}
  const u=unitCost(woodId,kind,mode);const mm=m==null?marginFor(woodId):+m;return{...u,margin:mm,suggested:Math.ceil(u.cost*(1+mm/100)/5)*5}}
const perQty=it=>it.mode==="rft"?(+it.W||0)*(+it.T||0)/144:1;
function suggestedFor(it,o){return Math.round(costBasis(it.wood,o.kind,it.mode,it.mode==="byp"?0:marginFor(it.wood,o)).suggested*perQty(it))}
function itemMat(it,kind){if(it.matRate!=null&&it.matRate!=="")return +it.matRate;return unitCost(it.wood,kind,it.mode).material*perQty(it)}
function itemFull(it,kind){return unitCost(it.wood,kind,it.mode).cost*perQty(it)}
function freezeCosts(o){o.items.forEach(it=>{if(it.matRate==null||it.matRate==="")it.matRate=Math.round(itemMat({...it,matRate:null},o.kind)*100)/100})}
function orderProfit(o){
  const rev=o.items.reduce((a,it)=>a+lineQty(it)*(+it.rate||0),0)-(+o.discount||0);
  const mat=o.items.reduce((a,it)=>a+lineQty(it)*itemMat(it,o.kind),0);
  const proc=o.items.reduce((a,it)=>{const u=unitCost(it.wood,o.kind,it.mode);return a+lineQty(it)*(u.cost-u.material)*perQty(it)},0);const full=mat+proc;
  const p=rev-full;return{rev,mat,full,profit:p,margin:rev?p/rev*100:0}}
/* Attendance: p.present[date] = true|"P" present, "H" half day, "A" absent, "L" leave.
   Every mark also writes its own sync key (att_<acct>_<person>_<date>) so two
   devices marking different workers never overwrite each other — sync.js
   folds them back into the mill doc after a pull. */
function markAtt(p,ds,val){if(val)p.present[ds]=val;else delete p.present[ds];if(S.acct)Store.set("att_"+scope()+"_"+p.id+"_"+ds,{v:val||null}).catch(()=>{})}
function attVal(p,ds){const v=(p.present||{})[ds];return v===true?"P":typeof v==="string"?v:""}
function attUnits(v){return v==="P"?1:v==="H"?.5:0}
function daysInMonth(m){const [y,mo]=m.split("-").map(Number);return new Date(y,mo,0).getDate()}
function wageFor(p,m){const c={P:0,H:0,A:0,L:0};Object.keys(p.present||{}).forEach(k=>{if(k.startsWith(m)){const v=attVal(p,k);if(c[v]!=null)c[v]++}});
  const units=c.P+c.H*.5,w=+p.wage||0,wd=S.data.settings.workDays||26;let earned=0;
  if(p.wageType==="daily")earned=w*units;
  else if(p.wageType==="monthly")earned=p.active||units?Math.max(0,w-w/wd*(c.A+c.H*.5)):0;
  return{...c,units,earned}}
const COUNTED=["confirmed","cutting","ready","delivered","paid"];
const OPEN=["quote","confirmed","cutting","ready"];
function monthReport(m){
  const d=S.data,s=d.settings;
  const ords=d.orders.filter(o=>COUNTED.includes(o.status)&&(o.date||"").startsWith(m));
  let rev=0,mat=0,cft=0;const by={};
  ords.forEach(o=>{o.items.forEach(it=>{const q=lineQty(it),r=q*(+it.rate||0),c=q*itemMat(it,o.kind),cf=lineCft(it);rev+=r;mat+=c;cft+=cf;
    const k=it.mode==="byp"?"__byp_"+it.wood:o.kind==="job"?"__job":it.wood;const b=by[k]||(by[k]={cft:0,rev:0,mat:0});b.cft+=cf;b.rev+=r;b.mat+=c});rev-=(+o.discount||0)});
  const gross=rev-mat;
  let wDaily=0,wMonthly=0,wPiece=0,days=0,planDaily=0;
  d.people.filter(p=>p.type==="labour").forEach(p=>{
    if(p.wageType==="daily"){const wf=wageFor(p,m);days+=wf.units;wDaily+=wf.earned;if(p.active)planDaily+=(+p.wage||0)*s.workDays}
    else if(p.wageType==="monthly"){wMonthly+=wageFor(p,m).earned}
    else if(p.wageType==="piece"&&p.active)wPiece+=(+p.wage||0)*cft});
  const oh=s.overheads||{};const ohT=["power","rent","maintenance","other"].reduce((a,k)=>a+(+oh[k]||0),0);
  const wages=wDaily+wMonthly+wPiece,net=gross-wages-ohT;
  const gpc=cft?gross/cft:0;const fixed=planDaily+wMonthly+ohT;
  const procActual=cft?(wages+ohT)/cft:0;
  return{m,ords,rev,mat,gross,cft,by,wDaily,wMonthly,wPiece,days,ohT,oh,wages,net,gpc,fixed,breakeven:gpc>0?fixed/gpc:null,procActual,procSet:s.sawing+s.labour};
}

function logMove(m){S.data.moves.push(m);if(S.data.moves.length>400)S.data.moves.splice(0,S.data.moves.length-400)}
function deductStock(o){const short=[];
  o.items.forEach(it=>{
    if(it.mode==="byp"){const b=bypOf(it.wood);if(b){const c=lineQty(it);if(c>+b.qty)short.push(b.en);b.qty=Math.max(0,Math.round(((+b.qty||0)-c)*100)/100)}return}
    const s=S.data.stock[it.wood];if(s){const c=lineCft(it);if(c>+s.qty)short.push(woodName(it.wood));s.qty=Math.max(0,Math.round(((+s.qty||0)-c)*100)/100);logMove({id:uid(),date:today(),wood:it.wood,delta:-c,note:"Order #"+o.no+(o.customer?" · "+o.customer:"")})}});
  o.deducted=true;return short}
function restoreStock(o){o.items.forEach(it=>{
    if(it.mode==="byp"){const b=bypOf(it.wood);if(b)b.qty=Math.round(((+b.qty||0)+lineQty(it))*100)/100;return}
    const s=S.data.stock[it.wood];if(s){const c=lineCft(it);s.qty=Math.round(((+s.qty||0)+c)*100)/100;logMove({id:uid(),date:today(),wood:it.wood,delta:c,note:"Order #"+o.no+" removed — stock added back"})}})}
const qtyByItem=o=>{const m={};(o.items||[]).forEach(it=>{const k=it.mode+":"+it.wood;m[k]=(m[k]||0)+(it.mode==="byp"?lineQty(it):lineCft(it))});return m};
function adjustStock(prev,o){const a=qtyByItem(prev),b=qtyByItem(o);
  new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{const diff=b[k]-a[k];if(!diff)return;const [mode,wood]=k.split(":");
    if(mode==="byp"){const bb=bypOf(wood);if(bb)bb.qty=Math.max(0,Math.round(((+bb.qty||0)-diff)*100)/100);return}
    const s=S.data.stock[wood];if(s){s.qty=Math.max(0,Math.round(((+s.qty||0)-diff)*100)/100);logMove({id:uid(),date:today(),wood,delta:-diff,note:"Order #"+o.no+" updated"})}})}
function migrate(d){
  d=d&&typeof d==="object"&&!Array.isArray(d)?d:{};
  d.profile=d.profile&&typeof d.profile==="object"?d.profile:{};
  d.profile.owner=d.profile.owner||"Owner";d.profile.mill=d.profile.mill||"My Saw Mill";
  for(const k of["people","auctions","customWoods","moves","orders","customers","waLog"])if(!Array.isArray(d[k]))d[k]=[];
  if(!d.stock||typeof d.stock!=="object"||Array.isArray(d.stock))d.stock={};
  if(d.byp&&typeof d.byp!=="object")d.byp=null;
  for(const k of["advances","wagePaid"])if(!d[k]||typeof d[k]!=="object"||Array.isArray(d[k]))d[k]={};
  d.seq=+d.seq||1;
  d.people.forEach(p=>{if(!p||typeof p!=="object")return;p.present=p.present||{};if(!["owner","coowner","labour"].includes(p.type))p.type="labour"});
  d.orders.forEach(o=>{if(!o||typeof o!=="object")return;o.items=(Array.isArray(o.items)?o.items:[]).filter(i=>i&&typeof i==="object");
    if(!STATUS[o.status])o.status="quote";o.no=+o.no||0;if(!o.id)o.id=uid()});
  d.auctions.forEach(a=>{if(a&&typeof a==="object"&&!ASTAT[a.status])a.status="watching"});
  d.seq=Math.max(d.seq,d.orders.reduce((m,o)=>Math.max(m,+o.no||0),0)+1);
  d.settings={recovery:60,...d.settings};d.settings.overheads={power:0,rent:0,maintenance:0,other:0,...(d.settings.overheads||{})};
  Object.values(d.stock||{}).forEach(s=>{if(s.avg==null)s.avg=+s.buy||0});
  d.profile.brand=d.profile.brand||"#24563A";
  d.settings={minMargin:5,density:20,sawdustShare:30,...d.settings};
  if(!d.byp){d.byp={};BYP_DEFAULTS.forEach(b=>d.byp[b.id]={...b,qty:0})}
  d.backup={freq:7,keep:10,...(d.backup||{})};
  d.wa={mode:"app",lang:"en",templates:{},api:{},...(d.wa||{})};d.waLog=d.waLog||[];
  if(!d.customers.length)d.orders.forEach(o=>linkCustomer(d,o));

function totals(o){
  const vals=o.items.map(it=>lineQty(it)*(+it.rate||0));const sub=vals.reduce((a,b)=>a+b,0);
  const adj=(+o.transport||0)-(+o.discount||0);const taxable=Math.max(0,sub+adj);
  const bk={};o.items.forEach((it,i)=>{const r=o.gstOn?itemGst(it):0;const share=sub?vals[i]/sub:1/Math.max(1,o.items.length);bk[r]=(bk[r]||0)+vals[i]+adj*share});
  let gst=0;const gb=Object.entries(bk).filter(([r])=>+r>0).map(([r,v])=>{const g=Math.max(0,v)*r/100;gst+=g;return{rate:+r,base:v,gst:g}}).sort((a,b)=>b.rate-a.rate);
  const total=taxable+gst;
  return{sub,taxable,gst,gb,total,balance:total-(+o.advance||0),cft:o.items.reduce((a,it)=>a+lineCft(it),0)};
}

function stockCft(){return Object.values(S.data.stock).reduce((a,s)=>a+(+s.qty||0),0)}

function yardEstimate(m){
  const d=S.data,s=d.settings,rec=Math.min(100,Math.max(1,+s.recovery||60));let resid=0;
  d.orders.filter(o=>COUNTED.includes(o.status)&&(o.date||"").startsWith(m)).forEach(o=>o.items.forEach(it=>{
    if(it.mode==="byp")return;const cf=lineCft(it);
    if(it.mode==="log"){if(o.kind==="job")resid+=cf*(1-rec/100);return}
    if(o.kind==="job"||d.stock[it.wood]?.form==="log")resid+=cf*(100/rec-1);else resid+=cf*s.wastage/100}));
  const kg=resid*s.density,sd=kg*s.sawdustShare/100,oc=kg-sd;
  const val=(id,k)=>{const b=bypOf(id);if(!b||!KGPER[b.unit])return 0;return k/KGPER[b.unit]*(+b.rate||0)};
  return{resid,kg,sd,oc,value:val("sawdust",sd)+val("offcuts",oc)}}
function viewByp(){
  const d=S.data,m=today().slice(0,7),list=Object.values(d.byp||{});

  sales.sort((a,b)=>b.o.date.localeCompare(a.o.date));
  const monthRev=sales.filter(x=>x.o.date.startsWith(m)).reduce((a,x)=>a+lineQty(x.it)*(+x.it.rate||0),0);
  const y=yardEstimate(m);

function viewProfit(){

  </div>

    <div class="card stack"><h3>How the month adds up</h3><div class="wf">

      ${row("Gross margin",inr(r.gross),"sum")}
      ${row(`− Daily wages (${r.days} worker-days attended)`,"− "+inr(r.wDaily),"neg")}
      ${row("− Monthly salaries","− "+inr(r.wMonthly),"neg")}

      ${row("− Rent","− "+inr(r.oh.rent),"neg")}
      ${row("− Other (phone, licence, misc.)","− "+inr(r.oh.other),"neg")}
      ${row("Net profit",inr(r.net),"sum big")}</div>
      <p class="small muted">Counts orders marked Confirmed, Cutting, Delivered or Paid in this month. GST is not profit: you collect it for the government. Transport charged to the customer is treated as a pass-through.</p></div>
    <div class="stack">
      <div class="card stack"><h3>Break-even</h3>${be?`<p>You need to sell about <b class="num">${fx(be,0)} CFT</b> a month to cover wages and running costs of ${inr(r.fixed)}.</p>
        <div class="meter" role="img" aria-label="${fx(beP,0)}% of break-even reached"><i style="width:${beP}%"></i></div><p class="small muted">${fx(r.cft,1)} CFT sold so far (${fx(beP,0)}%). ${r.cft>=be?"Every CFT from here adds about "+inr(r.gpc)+" profit.":"Still "+fx(be-r.cft,0)+" CFT to go."}</p>`:`<p class="muted small">Record some confirmed orders this month to work out your break-even volume.</p>`}</div>
      <div class="card stack"><h3>Is your rate formula right?</h3>${r.cft?`<p class="small">Your real wages + running costs came to <b class="num">${inr(r.procActual)}/CFT</b> this month. Your estimates assume <b class="num">${inr(r.procSet)}/CFT</b> for sawing + labour.</p>

      ${owners.length?`<div class="card stack"><h3>Owners' share of net profit</h3><div class="list">${owners.map(p=>`<div class="it"><div><b>${esc(p.name)}</b><div class="small muted">${+p.share}%</div></div><span class="num">${inr(r.net*(+p.share)/100)}</span></div>`).join("")}</div></div>`:""}
    </div></div>
  <div class="card stack"><h3>Profit by wood</h3>${woods.length?`<div class="tablewrap" style="border:0"><table><thead><tr><th>Wood</th><th class="r">CFT sold</th><th class="r">Sales</th><th class="r">Timber cost</th><th class="r">Gross margin</th><th class="r">Per CFT</th><th></th></tr></thead><tbody>

    <div class="row" style="justify-content:flex-end"><button class="btn primary" type="submit">${t("save")}</button></div></form>

function recalc(){
  const o=S.draft;if(!o)return;
  o.items.forEach((it,i)=>{const q=lineQty(it);const a=$("#a_"+i),qq=$("#q_"+i),s=$("#s_"+i);if(!a)return;
    const r=+it.rate||0;a.textContent=inr(q*r);
    if(it.mode==="byp"){const b=bypOf(it.wood)||{};qq.textContent=fx(q,1)+" "+(b.unit||"");
      const short=b.qty!=null&&q>(+b.qty||0)?` <span style="color:var(--warn);font-weight:600">only ${fx(b.qty,1)} ${esc(b.unit)} in yard</span>`:` · In yard ${fx(b.qty||0,1)} ${esc(b.unit||"")}`;
      s.innerHTML=`List rate <b class="num">${inr(b.rate)}</b>/${esc(b.unit||"")} · GST ${b.gst||0}%${short}${r!==+b.rate?` <button class="btn ghost sm" style="padding:0 4px;min-height:0" data-act="useSug" data-i="${i}" data-v="${b.rate}">Use list rate</button>`:""}`;return}
    qq.textContent=it.mode==="rft"?fx(q,1)+" rft · "+fx(lineCft(it))+" CFT":fx(q,3)+" CFT";
    const cb=costBasis(it.wood,o.kind,it.mode,marginFor(it.wood,o));const perUnit=perQty(it);
    const sug=Math.round(cb.suggested*perUnit),be=Math.round(cb.cost*perUnit);
    const lm=r?(r-be)/r*100:0;
    const state=!r?"":r<be?` <span style="color:var(--bad);font-weight:600">Loss of ${inr((be-r)*q)} on this item.</span>`:lm<S.data.settings.minMargin?` <span style="color:var(--warn);font-weight:600">Thin margin ${fx(lm,1)}%.</span>`:` <span class="pos">Margin ${fx(lm,1)}%.</span>`;
    const stk=o.kind==="sale"&&S.data.stock[it.wood]?` · In stock ${fx(S.data.stock[it.wood].qty,1)} CFT`+(lineCft(it)>S.data.stock[it.wood].qty?` <span style="color:var(--warn);font-weight:600">not enough</span>`:""):"";
    s.innerHTML=`${it.custom?`<span class="tag">your rate</span> `:""}Suggested <b class="num">${inr(sug)}</b>/${itemUnit(it)} at ${cb.margin}% · cost ${inr(be)}${stk}${state}${r!==sug?` <button class="btn ghost sm" style="padding:0 4px;min-height:0" data-act="useSug" data-i="${i}" data-v="${sug}">Use suggested</button>`:""}`;
  });
  const it0=o.items.find(x=>x.mode!=="byp")||o.items[0];const cb=costBasis(it0.wood,o.kind,it0.mode,marginFor(it0.wood,o));
  $("#bd").innerHTML=it0.mode==="byp"?`<p class="small">By-products carry no extra cost: the timber you sawed already paid for them. Their sale is almost pure profit.</p>`:`<div class="row between"><b>${esc(o.kind==="job"?"Job work rate":woodName(it0.wood))}</b><span class="muted">per CFT</span></div>`+cb.parts.map(([l,v])=>`<div class="row between"><span>${esc(l)}</span><span class="num">${inr(v)}</span></div>`).join("")+
    `<div class="row between" style="border-top:1px solid var(--line);padding-top:3px"><span>Cost (break-even)</span><span class="num">${inr(cb.cost)}</span></div><div class="row between"><span>+ Margin ${cb.margin}%</span><b class="num">${inr(cb.suggested)}</b></div>`;
  const op=orderProfit(o);const pb=$("#profitBox");
  if(pb)pb.innerHTML=`<div class="row between"><b>Your profit on this order</b><span class="pill ${op.profit<0?"p-bad":op.margin<S.data.settings.minMargin?"p-warn":"p-ok"} num">${fx(op.margin,1)}%</span></div>
    <div class="row between"><span>Sales value (before GST)</span><span class="num">${inr(op.rev)}</span></div>
    <div class="row between"><span>Timber cost${o.kind==="job"?" (customer's wood)":""}${o.items.some(x=>x.mode==="byp")?" · by-products cost nothing":""}</span><span class="num">− ${inr(op.mat)}</span></div>
    <div class="row between"><span>Sawing + labour (estimate)</span><span class="num">− ${inr(op.full-op.mat)}</span></div>
    <div class="row between" style="border-top:1px solid var(--line);padding-top:3px"><b>Profit</b><b class="num ${op.profit>=0?"pos":"neg"}">${inr(op.profit)}</b></div>
    <p class="small muted">Only you see this. It is not printed on the customer's estimate.${o.items.some(it=>it.matRate!=null&&it.matRate!=="")?" Timber cost is locked at the stock cost on the day you confirmed.":""}</p>`;
  const tt=totals(o);
  const ng=$("#negOut");if(ng){const tg=+o.target||0;
    const eff=tt.taxable?tt.gst/tt.taxable:0;const mm=S.data.settings.minMargin/100;
    const floor=Math.max(0,(tt.taxable-op.profit)*(1+eff));
    const x=(op.profit-mm*op.rev)/(1-mm);const walk=Math.max(0,(tt.taxable-x)*(1+eff));
    let h=`<div class="row between"><span>Walk-away price (keeps ${S.data.settings.minMargin}% profit)</span><b class="num">${inr(walk)}</b></div><div class="row between"><span>Cost price (zero profit)</span><span class="num">${inr(floor)}</span></div>`;
    if(tg>0){const disc=Math.round(tt.total/(1+eff)-tg/(1+eff));const newP=op.profit-disc;const newM=(op.rev-disc)?newP/(op.rev-disc)*100:0;
      if(disc<=0)h+=`<p class="pos">₹${Math.round(tg).toLocaleString("en-IN")} is at or above your quote. No discount needed.</p>`;
      else h+=`<p>To reach <b>${inr(tg)}</b>, give a discount of <b>${inr(disc)}</b>. Your profit becomes <b class="${newP>=0?"pos":"neg"}">${inr(newP)}</b> (${fx(newM,1)}%).</p>
        ${newP<0?`<div class="banner warn">This is ${inr(-newP)} below your cost. Counter at ${inr(walk)} instead.</div>`:newM<S.data.settings.minMargin?`<div class="banner warn">Below your ${S.data.settings.minMargin}% minimum margin.</div>`:""}
        <div class="row"><button class="btn sm ${newP<0?"danger":"primary"}" data-act="applyNeg" data-v="${disc+(+o.discount||0)}">${newP<0?"Apply anyway":"Apply ₹"+disc.toLocaleString("en-IN")+" discount"}</button>${tg<walk?`<button class="btn sm" data-act="applyNeg" data-v="${Math.max(0,Math.round(tt.total/(1+eff)-walk/(1+eff))+(+o.discount||0))}">Offer walk-away price</button>`:""}</div>`}
    ng.innerHTML=h}
  const half=tt.gst/2;
  $("#tot").innerHTML=`${tt.cft?`<div class="t"><span>Total volume</span><span class="num">${fx(tt.cft,3)} CFT</span></div>`:""}
    <div class="t"><span>Items</span><span class="num">${inr(tt.sub)}</span></div>
    ${+o.transport?`<div class="t"><span>Transport</span><span class="num">${inr(o.transport)}</span></div>`:""}
    ${+o.discount?`<div class="t"><span>Discount</span><span class="num">− ${inr(o.discount)}</span></div>`:""}
    <div class="t"><span>Taxable value</span><span class="num">${inr(tt.taxable)}</span></div>
    ${gstRows(tt,inr)}
    <div class="t grand"><span>${t("total")}</span><span class="num">${inr(tt.total)}</span></div>
    ${+o.advance?`<div class="t"><span>Advance</span><span class="num">− ${inr(o.advance)}</span></div><div class="t"><b>Balance due</b><b class="num">${inr(tt.balance)}</b></div>`:""}`;
  const wn=$("#waNudge");if(wn){const ph=(o.phone||"").replace(/\D/g,"");wn.innerHTML=ph.length>=10?`<div class="row"><button class="btn wa" data-act="waOrder" data-id="${o.id}">${WAI} Send “${esc(TPL_LABEL[tplForStatus(o.status)])}” on WhatsApp</button></div>`:`<p class="small muted">Add the customer's mobile number to send updates on WhatsApp.</p>`}
  const sn=$("#stockNote");if(sn)sn.textContent=o.deducted&&o.kind==="sale"?"Stock has been reduced for this order.":"";
}

function quoteText(o){
  const d=S.data,tt=totals(o);
  const L=[`*${d.profile.mill}*`,`${d.profile.district?d.profile.district+", ":""}${d.profile.state}${d.profile.gstin?" · GSTIN "+d.profile.gstin:""}`,`Estimate #${o.no} · ${fdate(o.date)}`,o.customer?`${t("customer")}: ${o.customer}`:"",""];
  o.items.forEach((it,i)=>{const q=lineQty(it);
    if(it.mode==="byp"){L.push(`${i+1}. ${itemName(it)} — ${fx(q,1)} ${itemUnit(it)} @ ${inr(it.rate)} = ${inr(q*it.rate)}`);return}
    const size=it.mode==="log"?`girth ${it.G}″ × ${it.L}′`:`${it.L}′ × ${it.W}″ × ${it.T}″`;
    L.push(`${i+1}. ${woodName(it.wood)} — ${size} × ${it.pcs} pcs`,`   ${fx(q,3)} ${it.mode==="rft"?"rft":"CFT"} @ ${inr(it.rate)} = ${inr(q*it.rate)}`)});
  L.push("");if(tt.cft)L.push(`Total volume: ${fx(tt.cft,3)} CFT`);
  if(+o.transport)L.push(`Transport: ${inr(o.transport)}`);
  if(+o.discount)L.push(`Discount: −${inr(o.discount)}`);
  tt.gb.forEach(g=>L.push(`GST ${g.rate}%: ${inr(g.gst)}`));
  L.push(`*${t("total")}: ${inr(tt.total)}*`);
  if(+o.advance)L.push(`Advance: ${inr(o.advance)} · Balance: ${inr(tt.balance)}`);
  if(o.notes)L.push(`Note: ${o.notes}`);
  L.push("",o.kind==="job"?"Sawing charges only. Customer's own timber.":"Rates valid for 7 days, subject to stock.",`Contact: ${d.profile.mobile}`);
  return L.filter((x,i)=>x!==""||L[i-1]!=="").join("\n");
}

/* ============ backup, restore, import, export, tune-up ============ */
const FREQS=[["0","Off"],["1","Every day"],["7","Every 7 days"],["15","Every 15 days"],["30","Every 30 days"]];
const bkKey=()=>"bakidx_"+scope();
const daysSince=ds=>ds?Math.floor((new Date(today()+"T00:00:00")-new Date(ds.slice(0,10)+"T00:00:00"))/864e5):9999;
function dataCounts(d){return{people:(d.people||[]).length,labour:(d.people||[]).filter(p=>p.type==="labour").length,orders:(d.orders||[]).length,woods:Object.keys(d.stock||{}).length,auctions:(d.auctions||[]).length}}
async function listBackups(){return (await Store.get(bkKey()))||[]}
async function makeBackup(reason){
  const idx=await listBackups();const id="bak_"+scope()+"_"+Date.now();const snap=JSON.parse(JSON.stringify(S.data));
  if(!await Store.set(id,snap)){toast("Backup failed: not enough storage. Download a backup file instead.");return null}
  idx.unshift({id,at:new Date().toISOString(),reason,size:JSON.stringify(snap).length,counts:dataCounts(snap)});
  const drop=idx.splice(Math.max(1,+S.data.backup.keep||10));for(const m of drop)await Store.del(m.id);
  await Store.set(bkKey(),idx);S.data.backup.last=new Date().toISOString();persist();return idx[0]}
async function autoBackup(){if(!S.data||S.acct==="demo")return;const b=S.data.backup||{};const f=+b.freq||0;
  if(f&&daysSince(b.last)>=f){const m=await makeBackup("Automatic · "+FREQS.find(x=>x[0]===String(f))[1].toLowerCase());if(m&&S.tab==="more")renderBackups()}}
setInterval(()=>{autoBackup().catch(()=>{})},60*60*1000);
const kb=n=>n>1048576?fx(n/1048576,1)+" MB":fx(n/1024,0)+" KB";
async function renderBackups(){const box=$("#bkList");if(!box)return;const idx=await listBackups();
  box.innerHTML=idx.length?`<div class="list">${idx.map(m=>`<div class="it"><div><b>${new Date(m.at).toLocaleString("en-IN",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}</b><div class="small muted">${esc(m.reason)} · ${m.counts.orders} orders · ${m.counts.people} people · ${m.counts.woods} woods · ${kb(m.size)}</div></div>
    <div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="bkRestore" data-id="${m.id}">Restore</button><button class="btn sm" data-act="bkDownload" data-id="${m.id}">Download</button><button class="btn sm danger" data-act="bkDelete" data-id="${m.id}" aria-label="Delete backup">×</button></div></div>`).join("")}</div>`
    :`<p class="small muted">No saved backups yet. Tap “Back up now”, or choose how often to back up automatically.</p>`}
function csvOf(rows){return "\ufeff"+rows.map(r=>r.map(c=>{c=String(c??"");return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(",")).join("\n")}
function exportCsv(kind){const d=S.data;let rows;
  if(kind==="orders"){rows=[["No","Date","Customer","Phone","Type","Status","Items","CFT","Sub-total","Discount","Transport","GST","Total","Advance","Balance","Profit"]];
    d.orders.forEach(o=>{const tt=totals(o),op=orderProfit(o);rows.push([o.no,o.date,o.customer,o.phone,o.kind,o.status,o.items.map(it=>itemName(it)+" "+fx(lineQty(it),2)+" "+itemUnit(it)+" @"+it.rate).join("; "),fx(tt.cft,3),Math.round(tt.sub),+o.discount||0,+o.transport||0,Math.round(tt.gst),Math.round(tt.total),+o.advance||0,Math.round(tt.balance),Math.round(op.profit)])})}
  if(kind==="stock"){rows=[["Wood","Local name","Form","Qty CFT","Avg cost","Last buy","Sell rate","Margin %","Alert at"]];Object.entries(d.stock).forEach(([k,s])=>rows.push([woodName(k),woodHi(k),s.form,s.qty,s.avg,s.buy,s.sell,s.margin??"",s.min]));
    rows.push([]);rows.push(["By-product","Local name","Unit","In yard","Rate","GST %","HSN"]);Object.values(d.byp||{}).forEach(b=>rows.push([b.en,b.hn,b.unit,b.qty,b.rate,b.gst,b.hsn]))}
  if(kind==="people"){rows=[["Name","Type","Role","Phone","Share %","Wage type","Wage","Joined","Active","ESIC/UAN","Aadhaar last 4","Address","Emergency"]];d.people.forEach(p=>rows.push([p.name,p.type,p.role,p.phone,p.share??"",p.wageType??"",p.wage??"",p.joined,p.active?"Yes":"No",p.esic??"",p.aadhaar4??"",p.address??"",p.emergency??""]))}
  if(kind==="auctions"){rows=[["Date","Corporation","Depot","State","Species","Lots","EMD","Status","Notes","Link"]];d.auctions.forEach(a=>rows.push([a.date,a.org,a.depot,a.state,a.species,a.lots,a.emd,a.status,a.notes,a.link]))}
  return saveBlob(new Blob([csvOf(rows)],{type:"text/csv"}),`aara-${kind}-${today()}.csv`)}
function parseBackup(txt){let j;try{j=JSON.parse(txt)}catch(e){return{err:"This file is not an Aara backup. Choose the .json file you downloaded from Aara."}}
  const d=j&&j.data&&j.data.profile?j.data:j&&j.profile?j:null;
  if(!d||!Array.isArray(d.people)||!Array.isArray(d.orders)||typeof d.stock!=="object")return{err:"This file does not contain Aara mill data."};
  return{d,at:j.exportedAt||null}}
function mergeInto(cur,inc){const log=[];const byId=a=>new Set(a.map(x=>x.id));
  for(const k of ["people","auctions","orders","moves","customWoods","customers"]){cur[k]=cur[k]||[];const ids=byId(cur[k]);let n=0;(inc[k]||[]).forEach(x=>{if(!ids.has(x.id)){cur[k].push(JSON.parse(JSON.stringify(x)));n++}});if(n)log.push(`${n} ${k==="customWoods"?"custom woods":k} added`)}
  const nos=new Set();cur.orders.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(o=>{if(nos.has(o.no)){o.no=Math.max(...cur.orders.map(x=>x.no))+1;log.push("an order number clash was renumbered")}nos.add(o.no)});
  let att=0;(inc.people||[]).forEach(p=>{const c=cur.people.find(x=>x.id===p.id);if(c&&p.present){c.present=c.present||{};Object.entries(p.present).forEach(([ds,v])=>{if(c.present[ds]==null){c.present[ds]=v;att++}})}});if(att)log.push(`${att} attendance days filled in`);
  let w=0;Object.entries(inc.stock||{}).forEach(([k,v])=>{if(!cur.stock[k]){cur.stock[k]={...v};w++}});if(w)log.push(`${w} woods added to stock`);
  cur.byp=cur.byp||{};Object.entries(inc.byp||{}).forEach(([k,v])=>{if(!cur.byp[k])cur.byp[k]={...v}});
  cur.seq=Math.max(cur.seq||1,inc.seq||1,...cur.orders.map(o=>(+o.no||0)+1));return log.length?log:["Nothing new: everything in the file is already here."]}
function tuneUp(d){const fix=[],note=[];migrate(d);
  const num=v=>Number.isFinite(+v)?+v:0;
  Object.entries(d.stock).forEach(([k,s])=>{["qty","buy","sell","avg","min"].forEach(f=>{if(s[f]!==""&&s[f]!=null&&!Number.isFinite(+s[f])){s[f]=0;fix.push(`Fixed a bad ${f} value for ${woodName(k)}`)}});
    if(+s.qty<0){s.qty=0;fix.push(`${woodName(k)} stock was below zero; set to 0`)}
    if(!+s.avg&&+s.buy){s.avg=+s.buy;fix.push(`${woodName(k)} had no average cost; used last buying rate`)}
    if(+s.sell&&+s.avg&&+s.sell<unitCost(k,"sale","sawn").cost)note.push(`${woodName(k)}: list rate ${inr(s.sell)} is below your cost ${inr(unitCost(k,"sale","sawn").cost)}`)});
  Object.values(d.byp||{}).forEach(b=>{if(+b.qty<0){b.qty=0;fix.push(`${b.en} was below zero; set to 0`)}});
  for(const k of ["people","auctions","orders","moves"]){const seen=new Set();(d[k]||[]).forEach(x=>{if(!x.id||seen.has(x.id)){x.id=uid();fix.push(`Gave a duplicate ${k.slice(0,-1)} record its own ID`)}seen.add(x.id)})}
  const before=d.orders.length;d.orders=d.orders.filter(o=>o.items&&o.items.length);if(d.orders.length<before)fix.push(`Removed ${before-d.orders.length} empty order(s)`);
  const nos=new Set();[...d.orders].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(o=>{if(!+o.no||nos.has(+o.no)){o.no=Math.max(0,...d.orders.map(x=>+x.no||0))+1;fix.push(`Renumbered an order with a repeated number to #${o.no}`)}nos.add(+o.no)});
  const mx=Math.max(0,...d.orders.map(o=>+o.no||0));if((d.seq||0)<=mx){d.seq=mx+1;fix.push(`Next order number set to #${d.seq}`)}
  let bad=0;d.people.forEach(p=>{p.present=p.present||{};Object.keys(p.present).forEach(ds=>{const v=p.present[ds];if(!(v===true||["P","H","A","L"].includes(v))||!/^\d{4}-\d{2}-\d{2}$/.test(ds)){delete p.present[ds];bad++}})});if(bad)fix.push(`Removed ${bad} broken attendance mark(s)`);
  const seenPh={};(d.customers||[]).forEach(c=>{const ph=digits(c.phone);if(ph&&seenPh[ph]){d.orders.forEach(o=>{if(o.custId===c.id)o.custId=seenPh[ph].id});c._dup=true;fix.push(`Merged duplicate customer ${c.name} into ${seenPh[ph].name}`)}else if(ph)seenPh[ph]=c});d.customers=(d.customers||[]).filter(c=>!c._dup);
  d.orders.forEach(o=>{if(!o.custId&&o.customer)linkCustomer(d,o)});
  const sh=d.people.filter(p=>p.type!=="labour").reduce((a,p)=>a+num(p.share),0);if(d.people.some(p=>p.type!=="labour")&&sh!==100)note.push(`Owner shares add up to ${sh}%, not 100%`);
  if(daysSince(d.backup.last)>30)note.push("No backup in the last 30 days");
  const size=JSON.stringify(d).length;if(size>200000)note.push(`Your data is ${kb(size)}. Consider removing an old logo or downloading and archiving old years.`);
  return{fix,note}}

const CTYPES=["Furniture maker","Carpenter","Builder / contractor","Interior designer","Packaging","Brick kiln / boiler","Hotel / dhaba","Farmer","Retail / walk-in","Other"];
const digits=v=>String(v||"").replace(/\D/g,"").slice(-10);
function linkCustomer(d,o){d.customers=d.customers||[];const nm=(o.customer||"").trim();const ph=digits(o.phone);
  if(!nm||/^walk-in/i.test(nm)&&!ph)return null;
  let c=o.custId&&d.customers.find(x=>x.id===o.custId);
  if(!c&&ph.length===10)c=d.customers.find(x=>digits(x.phone)===ph);
  if(!c)c=d.customers.find(x=>x.name.toLowerCase()===nm.toLowerCase());
  if(!c){c={id:uid(),name:nm,phone:ph.length===10?ph:"",type:"Other",city:"",address:"",gstin:"",email:"",notes:"",waOptIn:false,createdAt:o.date||today(),payments:[]};d.customers.push(c)}
  else if(!c.phone&&ph.length===10)c.phone=ph;
  o.custId=c.id;return c}
function orderDue(o){return ["confirmed","cutting","ready","delivered"].includes(o.status)?Math.max(0,Math.round(totals(o).balance)):0}
function custStats(c){const os=S.data.orders.filter(o=>o.custId===c.id).sort((a,b)=>(b.date||"").localeCompare(a.date||""));

async function makePdf(o){
  await loadScript("vendor/html2canvas.min.js");
  await loadScript("vendor/jspdf.umd.min.js");
  const host=document.createElement("div");host.style.cssText="position:fixed;left:-10000px;top:0;width:794px;background:#fff";host.innerHTML=docHTML(o);document.body.appendChild(host);
  try{const el=host.firstElementChild;

    await Promise.all([...el.querySelectorAll("img")].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
    const canvas=await window.html2canvas(el,{scale:2,backgroundColor:"#ffffff",logging:false});
    const pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4"});const pw=pdf.internal.pageSize.getWidth(),phh=pdf.internal.pageSize.getHeight();
    const sliceH=Math.floor(canvas.width*phh/pw);
    for(let y=0,pg=0;y<canvas.height;y+=sliceH,pg++){const c=document.createElement("canvas");c.width=canvas.width;c.height=Math.min(sliceH,canvas.height-y);
      const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(canvas,0,y,c.width,c.height,0,0,c.width,c.height);
      if(pg)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",0,0,pw,c.height*pw/c.width)}
    return pdf.output("blob")}finally{host.remove()}
}
async function saveBlob(blob,name){

    if(fs){const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)});
      const w=await fs.writeFile({path:name,data:b64,directory:"CACHE"});const sh=cap.Plugins&&cap.Plugins.Share;
      if(sh){try{await sh.share({title:name,url:w.uri})}catch(e){if(e&&e.message&&!/cancel/i.test(e.message))toast("Saved: "+name)}}
      else toast("Saved: "+name);return}}catch(e){}}
  const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000);toast("Downloaded "+name)}

  async attCsv(){const d=S.data,m=S.attMonth||today().slice(0,7),n=daysInMonth(m);const adv=(d.advances||{})[m]||{};
    const head=["Worker","Role","Wage type","Rate",...[...Array(n)].map((_,i)=>String(i+1)),"Present","Half","Absent","Leave","Days","Earned","Advance","Payable"];
    const lines=[head];d.people.filter(p=>p.type==="labour").forEach(p=>{const w=wageFor(p,m);const a=+adv[p.id]||0;lines.push([p.name,p.role||"",p.wageType,p.wage,...[...Array(n)].map((_,i)=>attVal(p,m+"-"+String(i+1).padStart(2,"0"))),w.P,w.H,w.A,w.L,w.units,Math.round(w.earned),a,Math.round(w.earned-a)])});
    const csv=lines.map(r=>r.map(c=>{c=String(c??"");return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(",")).join("\n");
    const blob=new Blob(["\ufeff"+csv],{type:"text/csv"});await saveBlob(blob,`attendance-${m}.csv`)},

  move(el){const k=el.dataset.id,dir=el.dataset.dir;openModal(`<form class="stack" data-form="move" data-id="${k}" data-dir="${dir}"><h2>${dir==="in"?"Stock in":"Stock out"} · ${esc(woodName(k))}</h2><p class="muted small">Now ${fx(S.data.stock[k].qty,1)} CFT</p>

  askDel(el){const k=el.dataset.kind,id=el.dataset.id;const what={person:()=>S.data.people.find(p=>p.id===id).name,auction:()=>"this auction",stock:()=>woodName(id)+" from your stock",order:()=>"order #"+S.data.orders.find(o=>o.id===id).no,customer:()=>S.data.customers.find(c=>c.id===id).name+" (orders are kept)",cwood:()=>"the wood "+woodName(id),account:()=>"your account and all mill data"}[k]();
    const ord=k==="order"&&S.data.orders.find(o=>o.id===id);
    openModal(`<div class="stack"><h2>Remove ${esc(what)}?</h2><p class="muted">${k==="account"?"Everything for this mill is deleted from "+(S.mode==="cloud"?"your account":"this device")+". Export a backup first if you need one.":ord&&ord.deducted&&ord.kind==="sale"?"The stock this order used will be added back. This cannot be undone.":"This cannot be undone."}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">${t("cancel")}</button><button class="btn danger" data-act="doDel" data-kind="${k}" data-id="${id||""}">${t("remove")}</button></div></div>`)},
  async doDel(el){const k=el.dataset.kind,id=el.dataset.id,d=S.data;
    if(k==="person")d.people=d.people.filter(p=>p.id!==id);
    if(k==="cwood"){if((d.stock||{})[id]||customWoodUsed(id)){closeModal();toast("This wood is used in orders or stock — remove those first");return}d.customWoods=d.customWoods.filter(c=>c.id!==id)}
    if(k==="auction")d.auctions=d.auctions.filter(a=>a.id!==id);
    if(k==="stock")delete d.stock[id];
    if(k==="order"){const o=d.orders.find(x=>x.id===id);if(o&&o.deducted&&o.kind==="sale")restoreStock(o);d.orders=d.orders.filter(x=>x.id!==id)}
    if(k==="customer"){d.customers=d.customers.filter(c=>c.id!==id);d.orders.forEach(o=>{if(o.custId===id)o.custId=null})}
    closeModal();
    if(k==="account"){if(S.mode==="cloud"&&S.role!=="owner"){toast("Only the owner can delete the mill.");return}await Store.delMill(scope());if(S.acct!=="demo"){delete S.accounts[S.acct];await Store.set("accounts",S.accounts)}ACT.logout();toast("Account deleted");return}
    persist();render();toast("Removed")},

  saveOrder(){if(!saveDraft())return;toast("Order #"+S.draft.no+" saved")},
  confirmOrder(el){const o=S.draft;const op=orderProfit(o);
    if(op.profit<0&&!(el&&el.dataset.force)){openModal(`<div class="stack"><h2>This order loses ${inr(-op.profit)}</h2><p>At these rates you are selling below your cost. Profit would be <b class="neg">${inr(op.profit)}</b> (${fx(op.margin,1)}%).</p><p class="small muted">Sometimes this is the right call: clearing old stock, keeping a big customer. Make sure it is on purpose.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Go back</button><button class="btn" data-act="priceMode" data-v="suggested" data-close="1">Use cost + margin rates</button><button class="btn danger" data-act="confirmOrder" data-force="1">Confirm at a loss</button></div></div>`);return}
    if(!(o.items||[]).some(it=>lineQty(it)>0)){toast("Add at least one item with a quantity before confirming");return}
    closeModal();freezeCosts(o);
    const short=o.deducted?[]:deductStock(o);o.status="confirmed";if(!saveDraft())return;render();
    toast(short.length?"Order confirmed — but "+short.join(", ")+" ran out of stock. Check Stock.":"Order confirmed and stock reduced")},

    if(!id)d.customers.push(c);d.orders.forEach(o=>{if(o.custId===c.id){o.customer=c.name;if(c.phone)o.phone=c.phone}});closeModal();persist();render();toast("Customer saved")}
  if(kind==="payment"){const c=d.customers.find(x=>x.id===form.dataset.id);let amt=+fd.amt||0;if(amt<=0)return;const total=amt;
    custStats(c).os.filter(o=>orderDue(o)).sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(o=>{if(amt<=0)return;const due=orderDue(o);const pay=Math.min(due,amt);o.advance=(+o.advance||0)+pay;amt-=pay;if(orderDue(o)===0&&o.status==="delivered")o.status="paid"});
    (c.payments=c.payments||[]).push({date:fd.pdate||today(),amt:total});persist();render();openModal(custDetail(c),true);toast(`${inr(total)} recorded${amt>0?" ("+inr(amt)+" more than the dues)":""}`)}
  if(kind==="waBroadcast"){const cs=d.customers.filter(c=>c.waOptIn&&digits(c.phone).length===10&&(fd.who==="all"||c.type===fd.who));
    openWaQueue(cs.map(c=>({name:c.name,phone:c.phone,text:fillTpl(fd.tpl,c,null),custId:c.id,tpl:fd.tpl})),TPL_LABEL[fd.tpl]+" · "+cs.length+" customers")}
  if(kind==="waTpl"){const w=d.wa;w.templates=w.templates||{};for(const [k,v] of Object.entries(fd)){if(v.trim()&&v!==(TPL[w.lang]||TPL.en)[k])w.templates[w.lang+":"+k]=v;else delete w.templates[w.lang+":"+k]}persist();toast("Templates saved")}
  if(kind==="waApi"){d.wa.api={provider:fd.provider,number:digits(fd.number),display:fd.display};persist();toast("Saved. Automatic sending will use these once the server is connected.")}
  if(kind==="byp"){const id=form.dataset.id||"b_"+uid();const was=d.byp[id]||{id};d.byp[id]={...was,id,en:fd.en.trim(),hn:fd.hn,unit:fd.unit,rate:+fd.rate||0,qty:+fd.qty||0,gst:+fd.gst||0,hsn:fd.hsn,note:fd.note};closeModal();persist();render();toast(fd.en+" saved")}
  if(kind==="bypIn"){const b=d.byp[form.dataset.id];b.qty=Math.round(((+b.qty||0)+(+fd.qty||0))*100)/100;closeModal();persist();render();toast(`${fx(b.qty,1)} ${b.unit} ${b.en} in yard`)}
  if(kind==="yard"){d.settings.density=+fd.density||20;d.settings.sawdustShare=+fd.sawdustShare||0;persist();render();toast("Saved")}
  if(kind==="bypSale"){const b=d.byp[fd.item];const q=+fd.qty||0;if(q<=0)return;
    const ord={id:uid(),no:d.seq,date:today(),customer:(fd.customer||"").trim()||"Walk-in buyer",phone:fd.phone||"",kind:"sale",items:[{id:uid(),mode:"byp",wood:b.id,q,rate:+fd.rate||0,matRate:0}],transport:0,discount:0,gstOn:!!fd.gstOn,status:fd.paid?"paid":"delivered",advance:0,deducted:true};
    if(fd.paid)ord.advance=Math.round(totals(ord).total);
    linkCustomer(d,ord);d.orders.push(ord);d.seq++;b.qty=Math.max(0,Math.round(((+b.qty||0)-q)*100)/100);closeModal();persist();render();
    toast(`Sale #${ord.no} saved · ${inr(totals(ord).total)}`);S.shareOrder=ord}
  if(kind==="overheads"){for(const k of ["power","maintenance","rent","other"])d.settings.overheads[k]=+fd[k]||0;persist();render();toast("Running costs saved")}
  if(kind==="letterhead"){Object.assign(d.profile,{brand:fd.brand||d.profile.brand,tagline:fd.tagline,address:fd.address,altPhone:fd.altPhone,email:fd.email,bank:fd.bank,acct:fd.acct,ifsc:(fd.ifsc||"").toUpperCase(),upi:fd.upi,terms:fd.terms});persist();render();toast("Letterhead saved")}
  if(kind==="pricing"){for(const k of ["wastage","sawing","labour","margin","gst","workDays","recovery","minMargin"])d.settings[k]=+fd[k]||0;d.settings.gstMode=fd.gstMode;persist();render();toast("Pricing saved")}
});

/* ============ boot ============ */
(async()=>{
  render();
  if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
  await Store.init();
  await loadAccounts();
  let sess=null;try{sess=sessionStorage.getItem("aara:session")}catch(e){}
  if(sess){const m=await Store.getMill(scope(sess));if(m){S.acct=sess;S.data=migrate(m);S.screen="app";
    const h=(location.hash||"").slice(1);if(["people","auctions","stock","orders","more"].includes(h))S.tab=h;render();autoBackup().catch(()=>{});return}}
  const h0=(location.hash||"").slice(1);
  if(h0==="demo"||h0.startsWith("demo/")){
    const st=await Store.getMill("demo");await enter("demo",st&&st.demoV===7?st:demoMill());
    const sub=h0.split("/")[1];
    if(sub==="estimate"){ACT.newOrder();return}
    if(sub==="share"){const o=S.data.orders[0];if(o){S.draft=JSON.parse(JSON.stringify(o));S.draft.saved=true;S.tab="estimate";render();openShare(S.draft)}return}
    if(S.data&&S.data.orders&&["people","auctions","stock","orders","more"].includes(sub)){S.tab=sub;render()}
    return}
  S.screen="auth";render();
})();
</script>
